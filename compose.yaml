services:
  php:
    build: ./backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/app
      - caddy_data:/data
      - caddy_config:/config

  # ブラウザテスト（Playwright）用。test 環境なので Fake Provider・固定時計になり、外部 API を呼ばない。
  # debug を付けるのは、AssetMapper がビルドなしでアセットを返せるようにするため。
  # 実行：docker compose --profile e2e run --rm --build e2e
  app-e2e:
    profiles: [e2e]
    build: ./backend
    environment:
      APP_ENV: test
      APP_DEBUG: "1"
    volumes:
      - ./backend:/app
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 既定の app-e2e は計測しない（FR-006）。計測の挙動を確かめるテストだけがこちらを使う。
  # Google への通信は Playwright で全てスタブ・遮断するので、外へは出ない
  app-e2e-analytics:
    profiles: [e2e]
    build: ./backend
    environment:
      APP_ENV: test
      APP_DEBUG: "1"
      GA_MEASUREMENT_ID: G-E2ETEST000
    volumes:
      - ./backend:/app
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 30

  e2e:
    profiles: [e2e]
    build: ./e2e
    depends_on:
      app-e2e:
        condition: service_healthy
      app-e2e-analytics:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://app-e2e
      E2E_ANALYTICS_BASE_URL: http://app-e2e-analytics
    volumes:
      - ./e2e/tests:/e2e/tests
      - ./e2e/playwright.config.js:/e2e/playwright.config.js
      # アイコン・共有用画像の書き出し（e2e/scripts/build-icons.mjs）用。通常のテストでは使わない
      - ./e2e/scripts:/e2e/scripts
      - ./e2e/icons:/e2e/icons
      - ./backend/assets/images:/out/images
      - ./backend/public:/out/public

volumes:
  caddy_data:
  caddy_config:
