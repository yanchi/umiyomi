# ホストの nginx の vhost。/etc/nginx/sites-available/umiyomi に置き、sites-enabled からリンクする。
# 同居している他サービス（shipinfo・shipinfo-v2 など）と同じ流儀（127.0.0.1 へのプロキシ）。
#
# 手順:
#   1. DOMAIN を umiyomi.isl-mentor.com に置き換えて配置する
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d DOMAIN
#      → certbot が 443 のブロックと HTTP→HTTPS のリダイレクトを追記する

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # certbot の HTTP-01 チャレンジはアプリに流さずホストで返す
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        # アプリの画面は meta robots で登録を制御する（トップだけ登録可）。nginx が直接 200 で中身を返すのは
        # チャレンジのファイルだけなので、そこにだけ付ける（502/504 は登録されず、301 は転送先で判断される）。
        # always は、ファイルがないときの 404 にも付けるため
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        # compose.prod.yml の APP_PORT と揃える
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;

        # X-Forwarded-For が無いと、アプリからは全員がプロキシの IP に見え、
        # 接続元ごとの取得回数制限がサイト全体で 1 つの枠になる
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
