# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # 未取得の地点を 5 秒以内に表示する（SC-002）ため、2 つの API を並列に呼び、どちらも 4 秒で打ち切る
            open_meteo_weather.client:
                base_uri: '%env(OPEN_METEO_WEATHER_URL)%'
                timeout: 4
                max_duration: 4
            open_meteo_marine.client:
                base_uri: '%env(OPEN_METEO_MARINE_URL)%'
                timeout: 4
                max_duration: 4

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
