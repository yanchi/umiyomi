# ホストの nginx の vhost。/etc/nginx/sites-available/umiyomi に置き、sites-enabled からリンクする。
# 同居している他サービス（shipinfo・shipinfo-v2 など）と同じ流儀（127.0.0.1 へのプロキシ）。
#
# 手順:
#   1. DOMAIN を umiyomi.isl-mentor.com に置き換えて配置する
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d DOMAIN
#      → certbot が 443 のブロックと HTTP→HTTPS のリダイレクトを追記する

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # 公開するまでは検索エンジンに載せない。公開するときはこの行を消す（deploy/README.md の「公開するとき」）。
    # robots.txt で Disallow にはしない。クローラーがページを読めずこのヘッダーに気づかないので、
    # よそからリンクされると URL だけ載ってしまう。クロールは許したまま noindex にする。
    # server に書くのは、certbot が 443 の server を作るときにこのブロックを写すから（location に書くと
    # 子の add_header で消えうる）
    add_header X-Robots-Tag "noindex, nofollow" always;

    # certbot の HTTP-01 チャレンジはアプリに流さずホストで返す
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # compose.prod.yml の APP_PORT と揃える
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;

        # X-Forwarded-For が無いと、アプリからは全員がプロキシの IP に見え、
        # 接続元ごとの取得回数制限がサイト全体で 1 つの枠になる
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
