# レイヤー間の依存方向を機械的に強制する（constitution 原則 II / III）。
# 依存方向: Presentation → Application → Domain ← Infrastructure
deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: src/Presentation/.*
    # 技術詳細。Domain / Application から参照させないために、外部ライブラリもレイヤーとして定義する
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Symfony|Doctrine|Twig|Psr)\\#'
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
      - Framework
    # Presentation は UseCase と Application の DTO だけを扱い、Domain を直接触らない
    Presentation:
      - Application
      - Framework
